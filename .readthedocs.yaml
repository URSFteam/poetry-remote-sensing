version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    build:
      html:
        - cat site.zip.part-* > /tmp/poetry-remote-sensing-site.zip
        - python -m zipfile -e /tmp/poetry-remote-sensing-site.zip /tmp/poetry-remote-sensing-site
        - mkdir --parents "$READTHEDOCS_OUTPUT/html/"
        - cp --recursive /tmp/poetry-remote-sensing-site/site/. "$READTHEDOCS_OUTPUT/html/"
