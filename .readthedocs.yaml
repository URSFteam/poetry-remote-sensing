version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

  jobs:
    build:
      html:
        - cat site.zip.part-* > /tmp/poetry-remote-sensing-site.zip

        - python -m zipfile -e /tmp/poetry-remote-sensing-site.zip /tmp/poetry-remote-sensing-site

        - >-
          printf '%s\n'
          '@import url("https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.7.0/style.css");'
          > /tmp/new-style.css

        - >-
          cat /tmp/poetry-remote-sensing-site/site/assets/style.css
          >> /tmp/new-style.css

        - >-
          printf '%s\n'
          '.poetry { font-family: "LXGW WenKai Lite", "Kaiti SC", STKaiti, KaiTi, serif !important; }'
          >> /tmp/new-style.css

        - >-
          mv /tmp/new-style.css
          /tmp/poetry-remote-sensing-site/site/assets/style.css

        - mkdir --parents "$READTHEDOCS_OUTPUT/html/"

        - cp --recursive /tmp/poetry-remote-sensing-site/site/. "$READTHEDOCS_OUTPUT/html/"
